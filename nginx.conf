events {}

http {
    include       mime.types;
    default_type  application/octet-stream;

    server {
        listen 80;
        server_name _;
        client_max_body_size 25M;          # allow uploads up to 25 MB (default is 1 MB)

        # Uploaded files are only sent through download.php; the shared library is not a page.
        location ^~ /uploads/ { return 404; }
        location ~ ^/(lib\.php|.*\.bak)$ { return 404; }

        location / {
            proxy_pass http://web:80;      # the Apache + PHP container
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
