services:
  # Front container: the only one reachable from outside (port 80).
  nginx:
    image: nginx:alpine
    container_name: unisubmit_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - web
    restart: unless-stopped
    networks:
      - app-tier

  # Backend container: Apache + PHP running the application.
  web:
    build: .
    container_name: unisubmit_web
    volumes:
      - ./src:/var/www/html
      - ./uploads:/var/www/html/uploads
    environment:
      - DB_HOST=db
      - DB_NAME=unisubmit_db
      - DB_USER=root
      - DB_PASS=rootpassword
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app-tier

  # Database container: MySQL 8 with a persistent volume.
  db:
    image: mysql:8.0
    container_name: unisubmit_db
    environment:
      - MYSQL_ROOT_PASSWORD=rootpassword
      - MYSQL_DATABASE=unisubmit_db
    volumes:
      - db_data:/var/lib/mysql
      - ./db_init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - app-tier

networks:
  app-tier:
    driver: bridge

volumes:
  db_data:
