events {}

http {
    include       mime.types;
    default_type  application/octet-stream;

    server {
        listen 80;
        server_name _;
        client_max_body_size 25M;

        # LLM grading (cold model load + generation) can exceed the 60s default.
        proxy_connect_timeout 180s;
        proxy_send_timeout    180s;
        proxy_read_timeout    180s;
        send_timeout          180s;

        # Submitted files are only handed out by download.php as attachments, so an uploaded
        # .php/.html file can never execute; the shared library is not a page.
        location ^~ /uploads/ { return 404; }
        location ~ ^/(lib\.php|worker\.php|.*\.bak)$ { return 404; }

        location / {
            proxy_pass http://web:80;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
